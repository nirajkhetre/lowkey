<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>lowkey — bills your hours</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<style>
/* bundled fonts (OFL): no web-font requests */
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/BricolageGrotesque.ttf) format("truetype");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.ttf) format("truetype");font-style:italic}
@font-face{font-family:"Geist Mono";src:url(fonts/GeistMono.ttf) format("truetype");font-weight:100 900}
:root{
  --bg:#F3EEE3; --paper:#FFFDF7; --ink:#111; --muted:#5d5a53; --line:2.5px solid var(--ink);
  --shadow:5px 5px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --lime:#B8FF3B; --pink:#FF7AD9; --blue:#7AA2FF; --yellow:#FFD23F; --orange:#FF8A3D; --grey:#d9d4c7;
  /* motion: real damped springs sampled into linear() (response .42s / damping .72, and .5s / .86),
     plus Material's emphasized curves for things entering and leaving */
  --spring:linear(0, 0.016, 0.059, 0.121, 0.196, 0.278, 0.363, 0.447, 0.529, 0.606, 0.677, 0.741, 0.797, 0.847, 0.89, 0.926, 0.955, 0.979, 0.998, 1.013, 1.023, 1.031, 1.035, 1.038, 1.038, 1.038, 1.036, 1.034, 1.031, 1.028, 1.024, 1.021, 1.018, 1.015, 1.012, 1.01, 1.008, 1.006, 1.004, 1.003, 1);
  --spring-soft:linear(0, 0.018, 0.064, 0.129, 0.204, 0.285, 0.366, 0.445, 0.52, 0.589, 0.652, 0.709, 0.759, 0.802, 0.84, 0.872, 0.899, 0.921, 0.94, 0.955, 0.968, 0.977, 0.985, 0.991, 0.996, 0.999, 1.001, 1.003, 1.004, 1.005, 1.005, 1.005, 1.005, 1.005, 1.004, 1.004, 1.003, 1.003, 1.003, 1.002, 1);
  --t-spring:.5s; --t-soft:.64s;
  --enter:cubic-bezier(.2,0,0,1); --exit:cubic-bezier(.3,0,1,1);
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"Geist Mono","Cascadia Code","Consolas","SF Mono",Menlo,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--paper:#1c1c1c;--ink:#f2efe8;--muted:#a9a49a;--grey:#3a3833}}
:root[data-theme="dark"]{--bg:#121212;--paper:#1c1c1c;--ink:#f2efe8;--muted:#a9a49a;--grey:#3a3833}
*{box-sizing:border-box}
h1 em,h2 em,h3 em,.label em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.3px}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--grey) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.35;min-height:100vh;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 80px;transition:transform var(--t-soft) var(--spring-soft),filter .3s}
/* buttons press fast and spring back slow, like something physical */
.btn{background:var(--paper);border:var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:9px 14px;font-weight:700;font-stretch:88%;cursor:pointer;white-space:nowrap;
  transition:transform .45s var(--spring),box-shadow .45s var(--spring),background .2s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
.btn.lime{background:var(--lime);color:#111}
.btn.quiet{box-shadow:none;background:transparent}          /* secondary: no shadow until you reach for it */
.btn.quiet:hover{box-shadow:var(--shadow-sm);background:var(--paper)}
.link{border:0;background:none;padding:6px 4px;font-weight:800;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.card{background:var(--paper);border:var(--line);border-radius:18px;box-shadow:var(--shadow)}
kbd{font-family:var(--mono);font-size:.75em;border:1.5px solid var(--ink);border-radius:5px;padding:0 5px;background:var(--paper)}

/* icon buttons: no labels, a tooltip explains them after a short hover (the same intent delay as the island) */
.ib{width:36px;height:36px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,transform .4s var(--spring)}
.ib:hover{background:var(--bg)}
.ib:active{transform:scale(.88);transition-duration:.06s}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible;transition:transform .4s var(--spring)}
.ib svg *{transition:transform .45s var(--spring);transform-box:fill-box;transform-origin:center}
#prev:hover svg{transform:translateX(-2px)} #next:hover svg{transform:translateX(2px)}
#openWrapped:hover .star{transform:scale(1.18) rotate(-12deg)}
#openSettings:hover .k1{transform:translateX(-4px)} #openSettings:hover .k2{transform:translateX(4px)}
#openClients:hover .k1{transform:translateY(-1.5px)} #openClients:hover .k2{transform:translateY(-1.5px) translateX(1px)}
#theme .half{transform-box:view-box;transform-origin:12px 12px}
#theme:hover .half{transform:rotate(180deg)}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-4px) scale(.94);transform-origin:50% 0;background:var(--ink);color:var(--bg);font:700 12.5px/1 var(--display);padding:7px 10px;border-radius:9px;white-space:pre;opacity:0;pointer-events:none;transition:opacity .12s,transform .35s var(--spring);z-index:10}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.35s}
#theme::after{left:auto;right:-4px;transform:translateY(-4px) scale(.94);transform-origin:100% 0}  /* the last icon: its tip opens leftward */
#theme:hover::after,#theme:focus-visible::after{transform:none}
html{overflow-x:clip}  /* a hidden tooltip near the edge must never add a sideways scrollbar */
.tip{position:fixed;z-index:15;max-width:300px;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;line-height:1.3;pointer-events:none;
  opacity:0;transform:translate(-50%,calc(-100% - 6px)) scale(.94);transform-origin:50% 100%;transition:opacity .12s,transform .35s var(--spring)}
.tip.show{opacity:1;transform:translate(-50%,calc(-100% - 12px)) scale(1)}
.tip b{font-weight:800}.tip span{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:6px}
.tip div{margin-top:3px;opacity:.85}

/* header: identity, one date control, one quiet tool group, one primary action */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;position:relative}
.logo .dot{color:var(--pink);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.pill{display:inline-flex;align-items:center;gap:7px;border:var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--paper);font-stretch:90%}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);display:inline-block}
.pill.warn i{background:var(--orange)}
.grp{display:flex;align-items:center;gap:2px;border:var(--line);border-radius:999px;background:var(--paper);box-shadow:var(--shadow-sm);padding:3px}
.datenav{margin-left:auto}
.datenav .day{font-weight:800;font-size:16px;min-width:112px;text-align:center}

/* hero */
.hero{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:18px;margin-bottom:22px}
.hero .card{padding:18px 20px;position:relative;overflow:hidden}
.label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.money{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1;margin:6px 0 4px}
.money-card{background:var(--lime)!important;color:#111}
.money-card .label,.money-card .sub{color:#333}
.split{display:flex;height:22px;border:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.split div{height:100%;transform-origin:left}
.stripes{background:repeating-linear-gradient(45deg,var(--grey) 0 6px,var(--paper) 6px 12px)}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.sub{color:var(--muted);font-weight:600;font-size:14px}
.queue{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .45s var(--spring),box-shadow .45s var(--spring)}
.queue:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.queue:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);transition-duration:.06s}
.qfoot{display:grid}
.qfoot>*{grid-area:1/1;transition:opacity .2s,transform .35s var(--spring)}
.qfoot .keys{opacity:0;transform:translateY(5px)}
.queue:hover .qfoot .sub:first-child{opacity:0;transform:translateY(-5px)}
.queue:hover .qfoot .keys{opacity:1;transform:none}            /* the shortcuts show up when you reach for the queue */


/* focus: one intention at a time. Now (with an honest ring: time against your estimate), one line to say what's
   next, and the queue with its reasons. Not a list app: there's no list screen. */
.focus{padding:16px 18px;margin-bottom:22px;display:grid;gap:14px}
.fnow{display:flex;align-items:center;gap:14px;min-height:58px}
.ring{width:56px;height:56px;flex:none;position:relative;--c:var(--lime)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--grey)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .9s var(--spring-soft),stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 12px/1 var(--mono)}
.ring.full .fg{filter:drop-shadow(0 0 4px var(--c))}
.fnow .what{flex:1;min-width:0}
.kick{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.fnow h3{margin:2px 0 4px;font-size:22px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 12.5px var(--mono);color:var(--muted)}
.tag2{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;font:800 12.5px var(--display);background:var(--c,var(--paper));color:#111}
.tag2.side{background:var(--paper);color:var(--ink)}
.onit i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;animation:beat 2.4s ease-in-out infinite}
.drift{background:var(--yellow);color:#111;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;font:800 12.5px var(--display)}
.factions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.factions .seg{animation:pop .4s var(--spring) both}
.capture{display:flex;align-items:center;gap:10px;border:var(--line);border-radius:14px;background:var(--bg);padding:6px 8px 6px 14px;transition:box-shadow .3s var(--spring),transform .3s var(--spring)}
.capture:focus-within{box-shadow:var(--shadow-sm);transform:translate(-1px,-1px)}
.capture svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.capture input{flex:1;min-width:0;border:0;background:none;font:700 16px var(--display);outline:none;color:var(--ink);padding:6px 0}
.capture input::placeholder{color:var(--muted);opacity:.8;transition:opacity .3s}
.capture input.swap::placeholder{opacity:0}
.capture kbd{opacity:.6}
.toks{display:flex;gap:6px;flex-wrap:wrap}
.tok{border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;font:800 12.5px var(--display);background:var(--paper);white-space:nowrap;animation:pop .35s var(--spring) both}
.tok.c{background:var(--c);color:#111}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.nexts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nx{display:inline-flex;align-items:center;gap:8px;border:var(--line);border-radius:999px;padding:5px 6px 5px 12px;background:var(--paper);cursor:pointer;font:700 14px var(--display);color:inherit;
  transition:transform .4s var(--spring),box-shadow .4s var(--spring)}
.nx:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.nx:active{transform:translate(1px,1px);box-shadow:none;transition-duration:.06s}
.nx>i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}
.nx small{font:600 11.5px var(--mono);color:var(--muted)}
.nx .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:opacity .2s,background .2s}
.nx:hover .x{opacity:.7}.nx .x:hover{opacity:1;background:var(--bg)}
.nx .x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.donecount{font:600 12.5px var(--mono);color:var(--muted);margin-left:auto}
html.vt-focus .vtf{view-transition-name:var(--vt)}

/* rolling digits: each digit is a column that rolls to its new value (Apple's numeric text transition) */
.roll{display:inline-flex;line-height:1}
.dg{display:inline-block;height:1em;overflow:hidden}
.dg>span{display:flex;flex-direction:column;transition:transform .7s var(--spring)}
.dg i{display:block;height:1em;font-style:normal;text-align:center}

/* timeline */
.timeline{padding:14px 16px 10px;margin-bottom:26px}
.track{position:relative;height:46px;border:var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.block{position:absolute;top:0;bottom:0;border-right:2px solid var(--ink);cursor:pointer;transform-origin:left;transition:filter .15s}
.block:hover{filter:brightness(1.08) saturate(1.2)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:2;pointer-events:none}
.now::after{content:"";position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);transform:translate(-50%,-50%);animation:beat 2s ease-in-out infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.25)}}
.hours{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}

/* segmented controls: one ink thumb springs to the chosen option */
.seg{position:relative;display:flex;border:var(--line);border-radius:999px;background:var(--paper);padding:3px}
.seg button{position:relative;z-index:1;flex:1;border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap;transition:color .25s}
.seg button:hover:not(.on):not(:disabled){color:var(--ink)}
.seg button.on{color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button b{font-family:var(--mono);font-size:12px;font-weight:600;opacity:.7;margin-left:2px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:999px;background:var(--ink)}
.seg.ready .thumb{transition:left var(--t-spring) var(--spring),width var(--t-spring) var(--spring)}
.seg:active .thumb{scale:.97;transition:left var(--t-spring) var(--spring),width var(--t-spring) var(--spring),scale .1s}
.filters button{flex:none}

/* sessions: the line is the content; the rest stays quiet until you need it */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0 auto 0 0;font-size:28px;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.s{display:flex;flex-direction:column;transition:transform .45s var(--spring),opacity .3s,box-shadow .45s var(--spring);outline:none;scroll-margin:90px}
.s:focus{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
.s.done{opacity:.7}
.s.done:hover,.s.done:focus{opacity:1}
.s .top{display:flex;align-items:center;gap:8px;padding:14px 14px 0}
.s .t{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.who{position:relative;display:inline-flex;border:var(--line);border-radius:999px;background:var(--c);color:#111;box-shadow:2px 2px 0 var(--ink);max-width:62%;transition:transform .4s var(--spring),box-shadow .4s var(--spring)}
.who:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.who.side{color:var(--ink)}
.who select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font-weight:800;font-size:14px;padding:4px 28px 4px 12px;cursor:pointer;max-width:100%;text-overflow:ellipsis}
.who select option{color:#111;background:#fff}
.who::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.s .body{padding:10px 14px 14px;flex:1;display:flex;flex-direction:column;gap:10px}
.task{font-size:19px;font-weight:700;line-height:1.25;outline:none;border-radius:8px;padding:2px 4px;margin:-2px -4px;cursor:text;transition:background .15s,box-shadow .2s}
.task:hover{background:var(--bg)}
.task[contenteditable=true]{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.meta i{font-style:normal;opacity:.6}
.meta .check{background:var(--yellow);color:#111;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-family:var(--display);font-weight:800}
.meta a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.why{font-family:var(--mono);font-size:12px;color:var(--muted);display:grid;grid-template-rows:0fr;margin-top:-10px;transition:grid-template-rows .45s var(--spring-soft),margin-top .45s var(--spring-soft)}
.why>div{overflow:hidden}
.why.open{grid-template-rows:1fr;margin-top:0}
.why.open>div{border-top:1.5px dashed var(--ink);padding-top:8px}
.why p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;align-items:center;margin-top:auto}
.verdict{display:inline-flex;align-items:center;gap:5px;border:var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;transform:rotate(-2deg)}
.verdict.billed{background:var(--lime);color:#111}
.verdict.nah{background:var(--bg);color:var(--muted)}
.verdict svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.verdict svg path{stroke-dasharray:24}
.verdict.fresh svg path{animation:draw .45s .28s var(--enter) both}      /* the tick draws itself in, once */
@keyframes draw{from{stroke-dashoffset:24}}
.empty{padding:40px;text-align:center;font-size:20px;font-weight:700}
.skel{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:180px}
.skel i{display:block;height:14px;border-radius:8px;background:linear-gradient(90deg,var(--bg) 25%,var(--grey) 40%,var(--bg) 60%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
.skel i:nth-child(1){width:38%;height:24px;border-radius:999px}.skel i:nth-child(2){width:92%;height:18px}.skel i:nth-child(3){width:70%;height:18px}.skel i:nth-child(4){width:46%;margin-top:auto}
@keyframes shimmer{from{background-position:100% 50%}to{background-position:0 50%}}

/* first load: sections rise in on a stagger, the day's blocks grow out of the timeline */
body.intro .focus,body.intro main>:not(.hero),body.intro .hero>*,body.intro #grid>*{animation:rise .8s var(--spring-soft) both;animation-delay:calc(var(--d,0) * 55ms)}
body.intro .block,body.intro .split>div,body.intro .lbar>div{animation:grow .9s var(--spring-soft) both;animation-delay:calc(260ms + var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}

/* snackbar: what just happened, with a way back (the shrinking line is the undo window) */
.snack{position:fixed;left:50%;bottom:22px;z-index:30;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:12px 12px 12px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transform:translate(-50%,calc(100% + 40px));transition:transform .5s var(--spring);overflow:hidden;max-width:calc(100% - 32px)}
.snack.show{transform:translate(-50%,0)}
.snack button{border:0;background:var(--lime);color:#111;font-weight:800;border-radius:9px;padding:5px 11px;cursor:pointer;transition:transform .4s var(--spring)}
.snack button:active{transform:scale(.92);transition-duration:.06s}
.snack button[hidden]{display:none}
.snack i{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--lime);transform-origin:left;transform:scaleX(0)}
.snack.show.undoable i{animation:count 5s linear forwards}
@keyframes count{from{transform:scaleX(1)}}

/* sheets (modals): rise on a soft spring over a blurred backdrop while the page recedes */

/* view transitions (progressive enhancement: browsers without them just update in place) */
::view-transition-group(*){animation-duration:var(--t-spring);animation-timing-function:var(--spring)}
/* cards: each card (and its main action) is its own layer, so filters re-flow them and "bill it" morphs into its sticker */
html.vt-cards .s{view-transition-name:var(--vt)}
html.vt-cards .vt-a{view-transition-name:var(--va)}
html.vt-cards .vt-b{view-transition-name:var(--vb)}
html.vt-cards::view-transition-old(root),html.vt-sheet::view-transition-old(root),html.vt-focus::view-transition-old(root){animation:none;opacity:0}
html.vt-cards::view-transition-new(root),html.vt-sheet::view-transition-new(root),html.vt-focus::view-transition-new(root){animation:none}
html.vt-cards::view-transition-new(*):only-child,html.vt-focus::view-transition-new(*):only-child{animation:vt-in .42s var(--enter) both}
html.vt-cards::view-transition-old(*):only-child,html.vt-focus::view-transition-old(*):only-child{animation:vt-out .2s var(--exit) both}
@keyframes vt-in{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.94)}}
/* days: the content slides along the x axis, the date rolls */
html.vt-fwd main,html.vt-back main{view-transition-name:content}
html.vt-fwd #dayLabel,html.vt-back #dayLabel{view-transition-name:day}
html.vt-fwd::view-transition-old(content){animation:slide-out-l .22s var(--exit) both}
html.vt-fwd::view-transition-new(content){animation:slide-in-r .5s var(--enter) both}
html.vt-back::view-transition-old(content){animation:slide-out-r .22s var(--exit) both}
html.vt-back::view-transition-new(content){animation:slide-in-l .5s var(--enter) both}
html.vt-fwd::view-transition-old(day){animation:roll-out-u .2s var(--exit) both}
html.vt-fwd::view-transition-new(day){animation:roll-in-u .45s var(--spring) both}
html.vt-back::view-transition-old(day){animation:roll-out-d .2s var(--exit) both}
html.vt-back::view-transition-new(day){animation:roll-in-d .45s var(--spring) both}
@keyframes slide-out-l{to{opacity:0;transform:translateX(-40px)}}
@keyframes slide-out-r{to{opacity:0;transform:translateX(40px)}}
@keyframes slide-in-r{from{opacity:0;transform:translateX(40px)}}
@keyframes slide-in-l{from{opacity:0;transform:translateX(-40px)}}
@keyframes roll-out-u{to{opacity:0;transform:translateY(-12px)}}
@keyframes roll-in-u{from{opacity:0;transform:translateY(12px)}}
@keyframes roll-out-d{to{opacity:0;transform:translateY(12px)}}
@keyframes roll-in-d{from{opacity:0;transform:translateY(-12px)}}
/* sheets: a container transform. The button grows into the sheet as one solid container; what was inside
   fades out at its own size and the sheet's content fades in at its own size, so nothing ever stretches */
html.vt-sheet::view-transition-group(sheet){animation-duration:var(--t-soft);animation-timing-function:var(--spring-soft);
  overflow:clip;border-radius:18px;background:var(--paper);box-shadow:0 0 0 2.5px var(--ink),var(--shadow)}
html.vt-sheet::view-transition-old(sheet),html.vt-sheet::view-transition-new(sheet){height:auto;width:auto;object-fit:none;inset:0;margin:auto}
html.vt-sheet::view-transition-old(sheet){animation:fade .12s linear reverse both}
html.vt-sheet::view-transition-new(sheet){animation:fade .26s .1s linear both}
/* theme: the new one spreads out from the switch as a circle */
html.vt-theme::view-transition-old(root),html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}

<script>
const $ = s => document.querySelector(s);
const S = { config:null, days:[], day:null, week:{}, filter:'all', focus:0, undo:null, fresh:null };
const PERSONAL = 'Personal';
const STILL = /HeadlessChrome/.test(navigator.userAgent);  // docs screenshots: render the settled state, no motion
if (STILL) document.documentElement.classList.add('still');
const REDUCED = STILL || matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICON = { check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
               x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' };
const CLOSE = `<button class="ib x" onclick="closeM()" aria-label="close">${ICON.x}</button>`;

const fmtH = s => { const m = Math.round(s/60); return m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`; };
const fmtT = ts => new Date(ts*1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).toLowerCase();
const money = n => `${S.config.me.currency}${Math.round(n).toLocaleString('en-IN')}`;
const client = name => S.config.clients.find(c => c.name === name);
const color = name => client(name)?.color || 'var(--grey)';
const rate = name => client(name)?.rate || 0;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const weekOf = day => { const d = new Date(day+'T00:00'); const mon = new Date(d); mon.setDate(d.getDate() - (d.getDay()+6)%7); const sun = new Date(mon); sun.setDate(mon.getDate()+6); return [iso(mon), iso(sun)]; };
const isBillable = s => s.billable && s.client !== PERSONAL && s.status !== 'nah';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = id => String(id).replace(/[^\w-]/g, '-');

/* ---------- motion helpers ---------- */
const running = {};
function transition(kind, update){  // run a DOM update as a View Transition when the browser can; otherwise just update
  if (!document.startViewTransition || REDUCED || document.hidden) { update(); const p = Promise.resolve(); p.finished = p; return p; }
  const html = document.documentElement;
  running[kind] = (running[kind] || 0) + 1;
  html.classList.add('vt-' + kind);
  const t = document.startViewTransition(update);
  const guard = setTimeout(() => t.skipTransition(), 1000);  // no frame to animate in (window hidden)? just apply it
  t.updateCallbackDone.finally(() => clearTimeout(guard));
  t.finished.finally(() => { if (!--running[kind]) html.classList.remove('vt-' + kind); });
  const p = t.updateCallbackDone.catch(() => {}); p.finished = t.finished.catch(() => {});
  return p;
}
function roll(el, text){  // Apple's numeric text: every digit is a column that rolls to its new value
  el.setAttribute('aria-label', text);

let ISL = null;
const islandSpot = () => fetch('/api/island').then(r => r.json()).then(j => ISL = j).catch(() => {});
function islandPoint(){  // the island's inner edge, in this page's coordinates (usually just outside the page)
  const g = ISL?.island, edge = g?.edge || ISL?.settings?.edge || 'top';
  const [sx, sy, sw, sh] = g?.screen || [screen.availLeft || 0, screen.availTop || 0, screen.width, screen.height];
  const k = Math.abs(screen.width / screen.height - sw / sh) < .02 ? screen.width / sw : 1;  // DIPs to this page's px
  const [px, py] = g ? [g.x, g.y] : {top:[sx + sw/2, sy], bottom:[sx + sw/2, sy + sh], left:[sx, sy + sh/2], right:[sx + sw, sy + sh/2]}[edge];

const hex = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#9a9aa6';
async function fly(r, text, color, islandText, kind){
  /* It pops out of what you changed, then swoops along an arc to where your island really sits on screen, pulled
     in faster and faster, shrinking and stretching along its path. The page draws it while it's inside the page;
     the island gets the same path in screen coordinates and the same start time, and draws it everywhere outside

  if (!r) return;
  await islandSpot();

  const dx = I.x - S.x, dy = I.y - S.y, dist = Math.hypot(dx, dy) || 1;
  const post = body => fetch('/api/catch', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: islandText, color: hex(color), kind, ...body})}).catch(() => {});

  document.body.appendChild(chip);

  const at = (x, y, sx, sy, opacity = 1) => ({transform: `translate(${x - w/2}px, ${y - h/2}px) scale(${sx}, ${sy})`, opacity});

  const frames = [{...at(S.x, S.y + 4, .2, .2, 0), offset: 0},
                  {...at(S.x, S.y - 6, 1.14, 1.14), offset: lift * .55 / T},                         // pops up out of it
                  {...at(S.x, S.y, 1, 1), offset: lift / T}];

  post({start_ms: lead, flight: {S: scr(S), C: scr(C), I: scr(I), vp: [I.ox / I.k, I.oy / I.k, innerWidth / I.k, innerHeight / I.k],
        lift_ms: lift, dur_ms: dur, w: w / I.k, h: h / I.k, label: text, edge: I.edge}});
}

/* optimistic: the change shows at once, saves in the background, and can be undone from the snackbar */
function update(i, patch, msg, undoable = true, chip = null){

  const from = chip?.from?.getBoundingClientRect?.() || chip?.from;
  if (patch.status === 'billed') S.fresh = s.id;
  const done = transition('cards', () => { Object.assign(s, patch); render(); });
  fetch('/api/edit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:s.id, ...patch})})
    .catch(() => snack("couldn't save that. is lowkey still running?"));
  if (msg) snack(msg, undoable ? () => update(i, prev, 'undone', false, {from: $('#snackUndo'), text: 'undone', island: 'undone', kind: 'undo'}) : null);
  if (chip) done.finished.then(() => {  // first it settles in place, then it flies home from where it now sits
    const there = chip.at && document.querySelector(`.s[data-i="${i}"] ${chip.at}`);

    const btn = el || document.querySelector(`.s[data-i="${i}"] [data-act="billed"]`), amt = money(s.active_s/3600*rate(s.client));
    burst(btn || document.querySelector(`.s[data-i="${i}"]`));

            island: `off the invoice · ${s.client}`, kind: 'nah'}).then(() => nextPending(i));

}
function nextPending(i){ const a=sessions(); const j=a.findIndex((s,k)=>k>i&&s.status==='pending'); if (j>=0){ S.focus=j; focusCard(j); } }
function review(){ transition('cards', () => { S.filter='pending'; renderCards(); }).then(() => { const first = document.querySelector('.s'); if (first) focusCard(+first.dataset.i); }); }

function shiftDay(n){
  const i = S.days.indexOf(S.day), j = Math.min(S.days.length-1, Math.max(0, i+n));

      ${top ? `<div class="factions"><button class="btn lime" id="fStart">start it</button></div>` : ''}`;

  const shown = F.all ? d.next : d.next.slice(0, 3), more = d.next.length - shown.length;
  $('#fnext').innerHTML = (d.next.length ? `<span class="kick">next up</span>` : '') +
    shown.map(x => `<button class="nx vtf" style="--c:${x.color};--vt:f-${tag(x.id)}" data-id="${x.id}" title="start it">
      <i></i>${esc(x.text)} <small>${esc(x.reason)}</small><span class="x" data-drop="${x.id}" title="drop it" aria-label="drop">${ICON.x}</span></button>`).join('') +
    (more ? `<button class="link" id="fMore" title="the rest of the queue">+${more} more</button>` : '') +
    (d.done.length ? `<span class="donecount" title="${esc(d.done.map(x => x.text).join(' · '))}">${d.done.length} done today</span>` : '');
  if (more) $('#fMore').onclick = () => transition('focus', () => { F.all = true; renderFocus(); });
  $('#fnext').querySelectorAll('.nx').forEach(b => b.onclick = e => {
    const x = d.next.find(i => i.id === b.dataset.id);
    if (e.target.closest('[data-drop]')) return drop(x, b);

  });

/* ---------- sheets ---------- */
function openSheet(modal, from){  // the button you pressed grows into the sheet (when the browser can morph)
  if (modal.classList.contains('open')) return;
  const card = modal.querySelector('.card');
  const go = morph => { closeOthers(modal); modal.classList.remove('closing'); modal.classList.toggle('morphed', morph);
                        modal.classList.add('open'); document.body.classList.add('sheeted'); };
  modal._from = from;
  if (!from || !document.startViewTransition || REDUCED || document.hidden) return go(false);
  from.style.viewTransitionName = 'sheet';
  transition('sheet', () => { from.style.viewTransitionName = ''; card.style.viewTransitionName = 'sheet'; go(true); })
    .then(() => setTimeout(() => card.style.viewTransitionName = '', 700));
}
const closeOthers = keep => document.querySelectorAll('.modal.open').forEach(m => m !== keep && m.classList.remove('open', 'morphed'));
function closeM(){
  const m = document.querySelector('.modal.open:not(.leaving)'); if (!m) return;
  const card = m.querySelector('.card'), from = m._from;
  const go = () => { m.classList.remove('open', 'closing', 'leaving', 'morphed'); document.body.classList.remove('sheeted'); };
  if (m.classList.contains('morphed') && from?.isConnected && document.startViewTransition && !document.hidden) {
    // it shrinks back into its button while the backdrop fades and the page springs back
    card.style.viewTransitionName = 'sheet';
    transition('sheet', () => { card.style.viewTransitionName = ''; from.style.viewTransitionName = 'sheet';
                                m.classList.add('leaving'); document.body.classList.remove('sheeted'); })
      .then(() => setTimeout(() => { from.style.viewTransitionName = ''; go(); }, 680));
  } else { document.body.classList.remove('sheeted'); m.classList.add('closing'); setTimeout(go, REDUCED ? 0 : 200); }
}

/* ---------- settings: the same three rows as the island's own settings, with one live preview ---------- */
const SAYS = {
  edge: {top:['top','hangs from the top edge, like a MacBook notch'], bottom:['bottom','sits on the bottom edge, by your taskbar'],
         left:['left','peeks out from the left side of your screen'], right:['right','peeks out from the right side of your screen']},
  taskbar: {below:['below it','hangs below the taskbar, never covers it'], over:['over it','sits over the taskbar: the true notch look']},
  rest: {lip:['tucked','just a glowing lip until you hover'], pill:['pill','client, timer and money always in view']}};
const ROWS = [['edge','lives on'], ['taskbar','taskbar'], ['rest','at rest']];
const thick = tb => tb==='top'||tb==='bottom' ? 9 : 6.5;
const offOf = l => l.tb===l.edge && !l.over ? thick(l.tb) : 0;   // "below" pushes the island inward by the taskbar's size
async function settings(from = $('#openSettings')){
  const r = await (await fetch('/api/settings')).json(), st = r.settings, mac = r.platform === 'darwin';
  const tb = ['top','bottom','left','right'].includes(r.taskbar) ? r.taskbar : 'none';
  const hint = `hover an option to preview it. changes apply instantly${r.island ? '' : ' · the island is off in the demo'}`;
  const look = (k, v) => { const l = {edge:st.edge, tb, over:st.taskbar==='over', rest:st.rest};
    if (k==='edge') l.edge = v; if (k==='taskbar'){ l.over = v==='over'; l.tb = l.edge; } if (k==='rest') l.rest = v; return l; };
  const now = look();
  $('#setCard').innerHTML = `${CLOSE}
    <h2 class="mtitle">island <em>settings</em></h2>
    <div class="stage"><div class="scr"><div class="tb tb-${now.tb}"></div><div class="isl isl-${now.edge} ${now.rest==='pill'?'pill':''}" style="--off:${offOf(now)}%"><i></i><b></b></div></div></div>
    <p class="says" id="says">${hint}</p>
    ${ROWS.map(([k,label]) => `<div class="srow"><span class="slabel">${label}</span><div class="seg" data-k="${k}"><span class="thumb"></span>${
      Object.entries(SAYS[k]).map(([v,[t]]) => `<button data-v="${v}" class="${st[k]===v?'on':''}" ${k==='taskbar'&&v==='over'&&mac?'disabled':''}>${t}</button>`).join('')}</div></div>`).join('')}`;
  openSheet($('#setModal'), from);
  const isl = $('#setCard .isl'), tbEl = $('#setCard .tb'), says = $('#says');
  let shown = now, intent;
  const paint = l => { isl.className = `isl isl-${l.edge} ${l.rest==='pill'?'pill':''}`; isl.style.setProperty('--off', offOf(l)+'%'); tbEl.className = `tb tb-${l.tb}`; shown = l; };
  const show = l => {  // same edge: glide there; a new edge: tuck into the old one, then bloom out of the new one
    clearTimeout(show.t);
    if (l.edge === shown.edge) return paint(l);
    isl.classList.add('tuck');
    show.t = setTimeout(() => {  // jump to the new edge already tucked (no transition), then let it bloom
      isl.style.transition = 'none'; paint(l); isl.classList.add('tuck'); void isl.offsetWidth;
      isl.style.transition = ''; isl.classList.remove('tuck');
    }, 210);
  };
  const say = t => { if (says.textContent === t) return; says.textContent = t;
    if (!REDUCED) says.animate([{opacity:0, transform:'translateY(4px)'}, {opacity:1, transform:'none'}], {duration:220, easing:'cubic-bezier(.2,0,0,1)'}); };
  const caption = (k, v, b) => b.disabled ? 'macOS keeps its menu bar on top, so it hangs below'
    : k==='taskbar' && r.taskbar !== st.edge ? (tb==='none' ? 'your taskbar is hidden, so this changes nothing' : `only matters on the ${r.taskbar} edge, where your taskbar is`)
    : SAYS[k][v][1];
  $('#setCard').querySelectorAll('.seg').forEach(seg => {
    const k = seg.dataset.k; placeThumb(seg);
    seg.querySelectorAll('button').forEach(b => {
      b.onmouseenter = () => { clearTimeout(intent); intent = setTimeout(() => { show(look(k, b.dataset.v)); say(caption(k, b.dataset.v, b)); }, 80); };
      b.onclick = async () => {
        if (b.disabled || st[k]===b.dataset.v) return;
        st[k] = b.dataset.v; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b)); placeThumb(seg);
        await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({[k]: b.dataset.v})});
        say(`saved · ${SAYS[k][b.dataset.v][0]}`);
      };
    });
    seg.onmouseleave = () => { clearTimeout(intent); intent = setTimeout(() => { show(look()); say(hint); }, 120); };
  });
}

/* ---------- wiring ---------- */
$('#prev').onclick = () => shiftDay(-1); $('#next').onclick = () => shiftDay(1);
$('#openClients').onclick = () => clients_();
$('#openWrapped').onclick = () => wrapped(); $('#openBill').onclick = () => bill(); $('#openSettings').onclick = () => settings();
$('#queueCard').onclick = review;
$('#snackUndo').onclick = () => { const f = S.undo; S.undo = null; $('#snack').classList.remove('show'); f && f(); };
document.querySelectorAll('.modal').forEach(m => m.onclick = e => { if (e.target===m) closeM(); });
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => { if (S.filter !== b.dataset.f) transition('cards', () => { S.filter = b.dataset.f; renderCards(); }); });
addEventListener('resize', () => document.querySelectorAll('.seg').forEach(placeThumb));
const SYS = matchMedia('(prefers-color-scheme: dark)'), sysTheme = () => SYS.matches ? 'dark' : 'light';
function applyTheme(t){  // no choice = follow the system (dark when your OS is dark); a choice overrides it
  const root = document.documentElement;
  if (t) { root.dataset.theme = t; root.style.colorScheme = t; } else { delete root.dataset.theme; root.style.colorScheme = ''; }
  const cur = root.dataset.theme || sysTheme();
  $('#theme').dataset.tip = root.dataset.theme ? `follow your system (${sysTheme()})` : `switch to ${cur === 'dark' ? 'light' : 'dark'}`;
}
SYS.addEventListener('change', () => applyTheme(document.documentElement.dataset.theme));
$('#theme').onclick = e => {  // the new theme spreads out from the switch as a circle
  const root = document.documentElement, cur = root.dataset.theme || sysTheme(), next = cur === 'dark' ? 'light' : 'dark';
  const pick = next === sysTheme() ? null : next;  // landing on the system's own theme means "automatic" again
  const flip = () => { applyTheme(pick); try { pick ? localStorage.setItem('lowkey.theme', pick) : localStorage.removeItem('lowkey.theme'); } catch {} };
  if (!document.startViewTransition || REDUCED) return flip();
  const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  root.classList.add('vt-theme');
  const t = document.startViewTransition(flip);
  t.ready.then(() => root.animate({clipPath:[`circle(0 at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`]},
                                   {duration:620, easing:'cubic-bezier(.2,0,0,1)', pseudoElement:'::view-transition-new(root)'}));
  t.finished.finally(() => root.classList.remove('vt-theme'));
};
try { applyTheme(localStorage.getItem('lowkey.theme')); } catch { applyTheme(null); }
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || ['INPUT','SELECT'].includes(e.target.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key==='z' && S.undo) { e.preventDefault(); return $('#snackUndo').click(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const n = sessions().length;
  if (e.key==='Escape') return closeM();
  if (e.key==='ArrowLeft') return shiftDay(-1);
  if (e.key==='ArrowRight') return shiftDay(1);
  if (e.key==='w') return wrapped();
  if (e.key==='b') return bill();
  if (e.key==='s') return settings();
  if (e.key==='c') return clients_();
  if (e.key==='i' || e.key==='/') { e.preventDefault(); return $('#intend').focus(); }
  if (!n) return;
  if (e.key==='j'||e.key==='k'){ S.focus = (S.focus + (e.key==='j'?1:-1) + n) % n; focusCard(S.focus); }
  if (e.key==='y') act(S.focus,'billed');
  if (e.key==='n') act(S.focus,'nah');
  if (e.key==='e') { e.preventDefault(); act(S.focus,'edit'); }
});
boot();
</script>
</body>
