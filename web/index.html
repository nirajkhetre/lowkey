<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lowkey — bills your hours</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<style>
:root{
  --bg:#F3EEE3; --paper:#FFFDF7; --ink:#111; --muted:#5d5a53; --line:2.5px solid var(--ink);
  --shadow:5px 5px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --lime:#B8FF3B; --pink:#FF7AD9; --blue:#7AA2FF; --yellow:#FFD23F; --orange:#FF8A3D; --grey:#d9d4c7;
  --display:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Code","Consolas","SFMono-Regular",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--paper:#1c1c1c;--ink:#f2efe8;--muted:#a9a49a;--grey:#3a3833}}
:root[data-theme="dark"]{--bg:#121212;--paper:#1c1c1c;--ink:#f2efe8;--muted:#a9a49a;--grey:#3a3833}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--grey) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.35;min-height:100vh}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.btn{background:var(--paper);border:var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:9px 14px;font-weight:700;cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.lime{background:var(--lime);color:#111}.btn.pink{background:var(--pink);color:#111}.btn.yellow{background:var(--yellow);color:#111}
.btn.ghost{box-shadow:none;border-style:dashed}
.card{background:var(--paper);border:var(--line);border-radius:18px;box-shadow:var(--shadow)}
kbd{font-family:var(--mono);font-size:.75em;border:1.5px solid var(--ink);border-radius:5px;padding:0 5px;background:var(--paper)}

/* header */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;position:relative}
.logo .dot{color:var(--pink);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.sticker{display:inline-block;background:var(--yellow);color:#111;border:var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;transform:rotate(-4deg);box-shadow:var(--shadow-sm)}
.datenav{display:flex;align-items:center;gap:6px;margin-left:auto}
.datenav .day{font-weight:800;font-size:18px;min-width:150px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:7px;border:var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--paper)}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);display:inline-block}
.pill.warn i{background:var(--orange)}

/* hero */
.hero{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:18px;margin-bottom:22px}
.hero .card{padding:18px 20px;position:relative;overflow:hidden}
.label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.money{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1;margin:6px 0 4px}
.money-card{background:var(--lime)!important;color:#111}
.money-card .label{color:#333}
.money-card::after{content:"💸";position:absolute;right:14px;top:8px;font-size:46px;transform:rotate(12deg)}
.split{display:flex;height:22px;border:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.split div{height:100%}
.stripes{background:repeating-linear-gradient(45deg,var(--grey) 0 6px,var(--paper) 6px 12px)}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.sub{color:var(--muted);font-weight:600;font-size:14px}
.money-card .sub{color:#333}

/* timeline */
.timeline{padding:14px 16px 10px;margin-bottom:26px}
.track{position:relative;height:46px;border:var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.block{position:absolute;top:0;bottom:0;border-right:2px solid var(--ink);cursor:pointer;transition:filter .1s}
.block:hover{filter:brightness(1.08) saturate(1.2)}
.hours{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}

/* sessions */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0 auto 0 0;font-size:28px;letter-spacing:-1px}
.chip{border:var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;background:var(--paper);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.s{display:flex;flex-direction:column;transition:transform .25s,opacity .25s;outline:none}
.s:focus{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
.s .top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:var(--line);border-radius:15px 15px 0 0;color:#111}
.s .top b{font-size:17px}
.s .top .t{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700}
.s .body{padding:14px;flex:1;display:flex;flex-direction:column;gap:10px;position:relative}
.task{font-size:19px;font-weight:700;line-height:1.25;outline:none;border-radius:8px;padding:2px 4px;margin:-2px -4px}
.task[contenteditable=true]{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700}
.tag{border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--bg)}
.tag.unsure{background:var(--yellow);color:#111}
.why{font-family:var(--mono);font-size:12px;color:var(--muted);display:none;border-top:1.5px dashed var(--ink);padding-top:8px}
.why.open{display:block}
.why div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;margin-top:auto}
.actions select{border:var(--line);border-radius:12px;padding:8px;background:var(--paper);font-weight:700;flex:1;min-width:0}
.stamp{position:absolute;right:12px;top:8px;font-weight:900;font-size:22px;letter-spacing:2px;padding:2px 10px;border:3px solid;border-radius:8px;transform:rotate(-12deg);opacity:.9}
.stamp.billed{color:#0a8a2a;border-color:#0a8a2a}
.stamp.nah{color:#c2185b;border-color:#c2185b}
.s.done{opacity:.72}
.empty{padding:40px;text-align:center;font-size:20px;font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.modal .card{max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.x{position:absolute;right:14px;top:12px}
.wrapped{background:linear-gradient(135deg,#FF7AD9,#7AA2FF 45%,#B8FF3B);background-size:200% 200%;animation:shift 8s ease infinite;color:#111}
@keyframes shift{50%{background-position:100% 100%}}
.wrapped h1{font-size:52px;letter-spacing:-3px;margin:4px 0 14px;line-height:.95}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wgrid .card{box-shadow:var(--shadow-sm);padding:14px;background:#FFFDF7;color:#111;border-color:#111}
.wgrid .card .big{font-size:30px}
.receipt{background:#fff;color:#111;font-family:var(--mono);padding:24px 26px 34px;border:none;border-radius:0;box-shadow:var(--shadow);
  -webkit-mask:radial-gradient(circle 8px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x;mask:radial-gradient(circle 8px at 50% 100%,#0000 98%,#000) 0 100%/18px 51% repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat}
.receipt h3{font-family:var(--display);font-size:30px;margin:0;letter-spacing:-1px}
.receipt table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.receipt td{padding:5px 2px;border-bottom:1px dashed #999;vertical-align:top}
.receipt td.n{text-align:right;white-space:nowrap}
.receipt .tot{font-size:22px;font-weight:800;text-align:right;border-top:2px solid #111;padding-top:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.row select,.row input{border:var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);font-weight:700}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;transition:transform .25s;z-index:30}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{margin-top:40px;font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:center}
footer b{color:var(--ink)}
.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.burst{position:fixed;pointer-events:none;font-size:22px;z-index:40;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:820px){.hero{grid-template-columns:1fr}.money{font-size:48px}.datenav{margin-left:0;width:100%;justify-content:space-between}}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:100%;box-shadow:none;-webkit-mask:none;mask:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">lowkey<span class="dot">.</span></div>
    <span class="sticker">🔒 100% on-device</span>
    <span class="pill" id="modelPill"><i></i><span>loading…</span></span>
    <div class="datenav">
      <button class="btn" id="prev" title="previous day (←)">←</button>
      <div class="day" id="dayLabel">—</div>
      <button class="btn" id="next" title="next day (→)">→</button>
    </div>
    <button class="btn pink" id="openWrapped">✨ wrapped</button>
    <button class="btn lime" id="openBill">💸 send the bill</button>
    <button class="btn ghost" id="theme" title="toggle theme">◐</button>
  </header>

  <section class="hero">
    <div class="card money-card">
      <div class="label">you made today</div>
      <div class="money" id="money">—</div>
      <div class="sub" id="moneySub">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">work vs. side quests</div>
      <div class="split" id="split"></div>
      <div class="sub" id="splitSub">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">vibe check queue</div>
      <div class="big" id="queue">—</div>
      <div class="sub">review with <kbd>Y</kbd> bill · <kbd>N</kbd> nah · <kbd>J</kbd>/<kbd>K</kbd> move</div>
    </div>
  </section>

  <section class="card timeline">
    <div class="label" style="margin-bottom:8px">your day, in blocks</div>
    <div class="track" id="track"></div>
    <div class="hours" id="hours"></div>
  </section>

  <div class="bar">
    <h2>today's receipts</h2>
    <span class="chip on" data-f="all">all</span>
    <span class="chip" data-f="pending">to review</span>
    <span class="chip" data-f="billed">billed</span>
    <span class="chip" data-f="personal">side quests</span>
  </div>
  <div class="grid" id="grid"></div>

  <footer id="foot"></footer>
</div>

<div class="modal" id="wrappedModal"><div class="card wrapped" id="wrappedCard"></div></div>
<div class="modal" id="billModal"><div class="card" id="billCard"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const S = { config:null, days:[], day:null, week:{}, filter:'all', focus:0 };
const PERSONAL = 'Personal';

const fmtH = s => { const m = Math.round(s/60); return m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`; };
const fmtT = ts => new Date(ts*1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).toLowerCase();
const money = n => `${S.config.me.currency}${Math.round(n).toLocaleString('en-IN')}`;
const client = name => S.config.clients.find(c => c.name === name);
const color = name => client(name)?.color || 'var(--grey)';
const rate = name => client(name)?.rate || 0;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const weekOf = day => { const d = new Date(day+'T00:00'); const mon = new Date(d); mon.setDate(d.getDate() - (d.getDay()+6)%7); const sun = new Date(mon); sun.setDate(mon.getDate()+6); return [iso(mon), iso(sun)]; };
const isBillable = s => s.billable && s.client !== PERSONAL && s.status !== 'nah';

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function burst(el, emojis='💸✨💰🧾'){
  const r = el.getBoundingClientRect();
  for (let i=0;i<14;i++){ const e=document.createElement('span'); e.className='burst'; e.textContent=[...emojis][i%[...emojis].length];
    e.style.left=(r.left+r.width/2)+'px'; e.style.top=(r.top+r.height/2)+'px';
    e.style.setProperty('--dx',(Math.random()*260-130)+'px'); e.style.setProperty('--dy',(Math.random()*-220-30)+'px'); e.style.setProperty('--r',(Math.random()*400-200)+'deg');
    document.body.appendChild(e); setTimeout(()=>e.remove(),950); }
}
function countUp(el, to){ const from = +el.dataset.v || 0; el.dataset.v = to; const t0 = performance.now();
  if (document.hidden) return el.textContent = money(to);
  const step = t => { const k = Math.min(1,(t-t0)/600); el.textContent = money(from+(to-from)*(1-(1-k)**3)); if (k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

async function boot(){
  const st = await (await fetch('/api/state')).json();
  S.config = st.config; S.days = st.days;
  const pill = $('#modelPill');
  pill.classList.toggle('warn', !st.model_ok);
  pill.querySelector('span').textContent = st.model_ok ? `${st.model} · on your GPU` : `${st.model} offline · keyword mode`;
  $('#foot').innerHTML = `<b>0 bytes</b> of your screen time left this laptop. labels by <b>${st.model}</b> via ollama on 127.0.0.1${st.demo ? ' · <b>demo week</b>' : ''}<br>open source — read every line of what watches you.`;
  S.day = S.days.at(-1) || iso(new Date());
  await load();
}

async function load(){
  const [from, to] = weekOf(S.day);
  if (!S.week[S.day]) {
    $('#grid').innerHTML = `<div class="card empty" style="grid-column:1/-1"><span class="spin">🍳</span> cooking your timesheet… the model is reading your day (only the first time)</div>`;
    S.week = await (await fetch(`/api/range?from=${from}&to=${to}`)).json();
  }
  S.focus = 0; render();
}

function sessions(){ return S.week[S.day] || []; }

function render(){
  const d = new Date(S.day+'T00:00');
  $('#dayLabel').textContent = d.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}).toLowerCase();
  const all = sessions();
  const bill = all.filter(isBillable), side = all.filter(s => !isBillable(s));
  const earned = bill.reduce((a,s)=>a+s.active_s/3600*rate(s.client),0);
  countUp($('#money'), earned);
  const bs = bill.reduce((a,s)=>a+s.active_s,0), ps = side.reduce((a,s)=>a+s.active_s,0);
  $('#moneySub').textContent = all.length ? `${fmtH(bs)} billable across ${new Set(bill.map(s=>s.client)).size} clients` : 'nothing tracked yet — go touch some code';
  const tot = bs+ps || 1;
  $('#split').innerHTML = S.config.clients.map(c => { const v = bill.filter(s=>s.client===c.name).reduce((a,s)=>a+s.active_s,0); return v ? `<div title="${c.name} ${fmtH(v)}" style="width:${v/tot*100}%;background:${c.color}"></div>` : ''; }).join('') + `<div class="stripes" style="flex:1"></div>`;
  $('#splitSub').textContent = `${fmtH(bs)} work · ${fmtH(ps)} side quests (no judgement)`;
  const pending = all.filter(s=>s.status==='pending').length;
  $('#queue').textContent = pending ? `${pending} to review` : (all.length ? 'all clear ✅' : '—');

  // timeline
  const tr = $('#track'), hrs = $('#hours');
  if (all.length){
    const h0 = Math.floor(new Date(all[0].start*1000).getHours()), h1 = Math.ceil(new Date(all.at(-1).end*1000).getHours()+ (new Date(all.at(-1).end*1000).getMinutes()?1:0));
    const t0 = new Date(S.day+'T00:00').getTime()/1000 + h0*3600, span = (h1-h0)*3600;
    tr.innerHTML = all.map((s,i)=>`<div class="block ${isBillable(s)?'':'stripes'}" data-i="${i}" title="${s.client} · ${fmtT(s.start)}–${fmtT(s.end)}" style="left:${(s.start-t0)/span*100}%;width:${(s.end-s.start)/span*100}%;${isBillable(s)?`background:${color(s.client)}`:''}"></div>`).join('');
    hrs.innerHTML = Array.from({length:h1-h0+1},(_,k)=>`<span>${((h0+k+11)%12)+1}${h0+k<12?'a':'p'}</span>`).join('');
    tr.querySelectorAll('.block').forEach(b => b.onclick = () => { S.focus = +b.dataset.i; S.filter='all'; renderCards(); document.querySelector(`.s[data-i="${b.dataset.i}"]`)?.focus(); });
  } else { tr.innerHTML=''; hrs.innerHTML=''; }
  renderCards();
}

function renderCards(){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.f===S.filter));
  const all = sessions();
  const shown = all.map((s,i)=>[s,i]).filter(([s])=> S.filter==='all' || (S.filter==='pending'&&s.status==='pending') || (S.filter==='billed'&&s.status==='billed') || (S.filter==='personal'&&!isBillable(s)));
  if (!shown.length){ $('#grid').innerHTML = `<div class="card empty" style="grid-column:1/-1">${all.length ? 'nothing here bestie ✨' : 'no receipts yet. lowkey is watching (respectfully) 👀'}</div>`; return; }
  const opts = n => [...S.config.clients.map(c=>c.name), PERSONAL].map(c=>`<option ${c===n?'selected':''}>${c}</option>`).join('');
  $('#grid').innerHTML = shown.map(([s,i]) => {
    const unsure = s.confidence < 0.6, billable = isBillable(s);
    return `<article class="card s ${s.status!=='pending'?'done':''}" tabindex="0" data-i="${i}">
      <div class="top" style="background:${billable?color(s.client):'var(--grey)'}${billable?'':';color:var(--ink)'}"><b>${billable?'💼':'🎮'} ${s.client}</b><span class="t">${fmtT(s.start)} → ${fmtT(s.end)}</span></div>
      <div class="body">
        ${s.status==='billed'?'<span class="stamp billed">BILLED</span>':s.status==='nah'?'<span class="stamp nah">NAH</span>':''}
        <div class="task" data-i="${i}">${esc(s.task)}</div>
        <div class="meta">
          <span class="tag">⏱ ${fmtH(s.active_s)} active</span>
          ${billable?`<span class="tag">${money(s.active_s/3600*rate(s.client))}</span>`:''}
          <span class="tag ${unsure?'unsure':''}">${s.by==='rules'?'📏 keyword guess':unsure?`🤔 ${Math.round(s.confidence*100)}% backed by your windows — check me`:`🤖 ${Math.round(s.confidence*100)}% backed by your windows`}</span>
          <a href="#" class="tag whyBtn" data-i="${i}" style="color:inherit;text-decoration:none">🧾 why?</a>
        </div>
        <div class="why" id="why${i}">${s.evidence.map(e=>`<div>${fmtH(e.s)} · ${esc(e.app.replace('.exe',''))} — ${esc(e.title)}</div>`).join('')}</div>
        <div class="actions">
          <button class="btn lime" data-act="billed" data-i="${i}">bill it ✅</button>
          <button class="btn" data-act="nah" data-i="${i}">nah 🙅</button>
          <select data-i="${i}" title="change client">${opts(s.client)}</select>
          <button class="btn ghost" data-act="edit" data-i="${i}" title="edit line (E)">✏️</button>
        </div>
      </div></article>`;
  }).join('');
  $('#grid').querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(+b.dataset.i, b.dataset.act, b));
  $('#grid').querySelectorAll('select').forEach(sel => sel.onchange = () => update(+sel.dataset.i, {client: sel.value, billable: sel.value!==PERSONAL}, `moved to ${sel.value} 👉`));
  $('#grid').querySelectorAll('.whyBtn').forEach(a => a.onclick = e => { e.preventDefault(); $('#why'+a.dataset.i).classList.toggle('open'); });
  $('#grid').querySelectorAll('.s').forEach(c => c.onfocus = () => S.focus = +c.dataset.i);
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function update(i, patch, msg){
  const s = sessions()[i]; Object.assign(s, patch);
  await fetch('/api/edit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:s.id, ...patch})});
  render(); if (msg) toast(msg);
  document.querySelector(`.s[data-i="${i}"]`)?.focus();
}
function act(i, what, el){
  if (what==='billed'){ const s=sessions()[i]; if (!isBillable({...s,status:'billed'})) return toast('that one is a side quest — pick a client first'); burst(el||document.querySelector(`.s[data-i="${i}"]`)); update(i,{status:'billed'}, ['secured the bag 💰','billed. no cap 🧢','ka-ching 🧾','receipts saved ✅'][i%4]); nextPending(i); }
  if (what==='nah') { update(i,{status:'nah'}, 'yeeted from the invoice 🗑️'); nextPending(i); }
  if (what==='edit'){ const t=document.querySelector(`.task[data-i="${i}"]`); t.contentEditable=true; t.focus(); document.getSelection().selectAllChildren(t);
    t.onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); t.blur(); } e.stopPropagation(); };
    t.onblur = () => { t.contentEditable=false; const v=t.textContent.trim(); if (v && v!==sessions()[i].task) update(i,{task:v},'line updated ✍️'); }; }
}
function nextPending(i){ const a=sessions(); const j=a.findIndex((s,k)=>k>i&&s.status==='pending'); if (j>=0){ S.focus=j; setTimeout(()=>document.querySelector(`.s[data-i="${j}"]`)?.focus(),60);} }

function shiftDay(n){ const i = S.days.indexOf(S.day); const j = Math.min(S.days.length-1, Math.max(0, i+n)); if (i<0||j===i) return toast(n<0?'no older receipts':'that\'s the latest day'); S.day = S.days[j]; load(); }

/* ---------- wrapped ---------- */
function wrapped(){
  const days = Object.entries(S.week).filter(([,a])=>a.length);
  const all = days.flatMap(([,a])=>a);
  const bill = all.filter(isBillable), side = all.filter(s=>!isBillable(s));
  const by = {}; bill.forEach(s=> by[s.client]=(by[s.client]||0)+s.active_s);
  const top = Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const apps = {}; all.forEach(s=>s.evidence.forEach(e=> apps[e.app]=(apps[e.app]||0)+e.s));
  const mainApp = Object.entries(apps).sort((a,b)=>b[1]-a[1])[0];
  const flow = bill.reduce((m,s)=> s.active_s>m.active_s?s:m, {active_s:0});
  const earned = bill.reduce((a,s)=>a+s.active_s/3600*rate(s.client),0);
  const bestDay = days.map(([d,a])=>[d,a.filter(isBillable).reduce((x,s)=>x+s.active_s,0)]).sort((a,b)=>b[1]-a[1])[0];
  const [from,to] = weekOf(S.day);
  $('#wrappedCard').innerHTML = `<button class="btn x" onclick="closeM()">✕</button>
    <div class="label" style="color:#111">your week, wrapped · ${from} → ${to}</div>
    <h1>you secured<br>${money(earned)} 💅</h1>
    <div class="wgrid">
      <div class="card"><div class="label">billable</div><div class="big">${fmtH(bill.reduce((a,s)=>a+s.active_s,0))}</div><div class="sub">across ${days.length} days</div></div>
      <div class="card"><div class="label">main character client</div><div class="big">${top?top[0]:'—'}</div><div class="sub">${top?fmtH(top[1]):''} of your life</div></div>
      <div class="card"><div class="label">longest flow state</div><div class="big">${flow.active_s?fmtH(flow.active_s):'—'}</div><div class="sub">${flow.task?esc(flow.task.slice(0,48)):''}</div></div>
      <div class="card"><div class="label">most-used app</div><div class="big">${mainApp?esc(mainApp[0].replace('.exe','')):'—'}</div><div class="sub">${mainApp?fmtH(mainApp[1]):''} together 🫶</div></div>
      <div class="card"><div class="label">side quests</div><div class="big">${fmtH(side.reduce((a,s)=>a+s.active_s,0))}</div><div class="sub">youtube & chill, unbilled</div></div>
      <div class="card"><div class="label">peak day</div><div class="big">${bestDay?new Date(bestDay[0]+'T00:00').toLocaleDateString([], {weekday:'long'}).toLowerCase():'—'}</div><div class="sub">${bestDay?fmtH(bestDay[1])+' billable':''}</div></div>
    </div>
    <p style="font-weight:800;margin:16px 0 0">screenshot this. it never left your laptop either 🔒</p>`;
  $('#wrappedModal').classList.add('open');
}

/* ---------- bill ---------- */
function bill(){
  const opts = S.config.clients.map(c=>`<option>${c.name}</option>`).join('');
  const [from,to] = weekOf(S.day);
  $('#billCard').innerHTML = `<button class="btn x" onclick="closeM()">✕</button>
    <h2 style="margin:0 0 12px;font-size:30px;letter-spacing:-1px">send the bill 💸</h2>
    <div class="row"><select id="bClient">${opts}</select><span class="sub">${from} → ${to}</span>
      <label class="sub"><input type="checkbox" id="bPending"> include unreviewed</label></div>
    <div id="receipt" class="receipt"></div>
    <div class="row" style="margin-top:18px"><button class="btn lime" onclick="window.print()">🖨️ save as PDF</button><button class="btn" id="csv">📋 copy CSV</button></div>`;
  const draw = () => {
    const c = client($('#bClient').value), inc = $('#bPending').checked;
    const rows = Object.entries(S.week).flatMap(([d,a])=>a.map(s=>({...s,d}))).filter(s=>s.client===c.name && isBillable(s) && (s.status==='billed' || (inc && s.status==='pending')));
    const hrs = rows.reduce((a,s)=>a+s.active_s/3600,0);
    const pend = Object.values(S.week).flat().filter(s=>s.client===c.name&&s.status==='pending'&&isBillable(s)).length;
    $('#receipt').innerHTML = `<h3>INVOICE</h3><div>${esc(S.config.me.name)} · ${esc(S.config.me.email)}</div><div>bill to: <b>${esc(c.name)}</b> · ${from} → ${to}</div>
      <table>${rows.map(s=>`<tr><td>${s.d.slice(5)}</td><td>${esc(s.task)}</td><td class="n">${(s.active_s/3600).toFixed(2)}h</td><td class="n">${money(s.active_s/3600*c.rate)}</td></tr>`).join('') || '<tr><td>no billed sessions yet — hit "bill it ✅" on some cards</td></tr>'}</table>
      <div>${hrs.toFixed(2)}h × ${money(c.rate)}/h</div><div class="tot">TOTAL ${money(hrs*c.rate)}</div>
      ${pend && !inc ? `<div style="margin-top:8px">⚠ ${pend} session(s) still waiting for a vibe check</div>` : ''}
      <div style="margin-top:10px;font-size:11px">generated locally by lowkey · every line backed by activity receipts</div>`;
    $('#csv').onclick = () => { navigator.clipboard.writeText(['date,task,hours,amount', ...rows.map(s=>`${s.d},"${s.task.replace(/"/g,'""')}",${(s.active_s/3600).toFixed(2)},${Math.round(s.active_s/3600*c.rate)}`)].join('\n')); toast('CSV copied 📋'); };
  };
  $('#bClient').onchange = draw; $('#bPending').onchange = draw; draw();
  $('#billModal').classList.add('open');
}
function closeM(){ document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open')); }

/* ---------- wiring ---------- */
$('#prev').onclick = () => shiftDay(-1); $('#next').onclick = () => shiftDay(1);
$('#openWrapped').onclick = wrapped; $('#openBill').onclick = bill;
document.querySelectorAll('.modal').forEach(m => m.onclick = e => { if (e.target===m) closeM(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { S.filter = c.dataset.f; renderCards(); });
$('#theme').onclick = () => { const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark'; try{localStorage.lowkeyTheme=r.dataset.theme}catch{} };
try { if (localStorage.lowkeyTheme) document.documentElement.dataset.theme = localStorage.lowkeyTheme; } catch {}
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || ['INPUT','SELECT'].includes(e.target.tagName)) return;
  const n = sessions().length;
  if (e.key==='Escape') return closeM();
  if (e.key==='ArrowLeft') return shiftDay(-1);
  if (e.key==='ArrowRight') return shiftDay(1);
  if (e.key==='w') return wrapped();
  if (e.key==='b') return bill();
  if (!n) return;
  if (e.key==='j'||e.key==='k'){ S.focus = (S.focus + (e.key==='j'?1:-1) + n) % n; document.querySelector(`.s[data-i="${S.focus}"]`)?.focus(); }
  if (e.key==='y') act(S.focus,'billed');
  if (e.key==='n') act(S.focus,'nah');
  if (e.key==='e') { e.preventDefault(); act(S.focus,'edit'); }
});
boot();
</script>
</body>
</html>
